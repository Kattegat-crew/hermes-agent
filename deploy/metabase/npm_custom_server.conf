# ─── Universal Forward Auth (Pocket ID via oauth2-proxy) ────────────────────
# Injected into auditoria.neuralcrewlabs.com proxy host in NPM
# Apply this as the "Custom Nginx Configuration" in the NPM proxy host form.

# Guard: every request must carry a valid Pocket ID session
include /data/nginx/custom/forward_auth_guard.conf;

# Metabase needs real client IPs for audit logs
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Required for Metabase WebSocket (live queries / dashboards)
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
