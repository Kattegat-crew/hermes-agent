services:
  hermes:
    build: .
    image: hermes-agent-hermes
    container_name: hermes-agent
    ports:
      - "3000:3000"
      - "9119:9119"
    environment:
      - TZ=America/Bogota
      - HOME=/opt/data/home
      - HERMES_UID=10000
      - HERMES_GID=10000
      - ENGRAM_DATA_DIR=/opt/data/home/.engram
    volumes:
      - ./data:/opt/data
      - /root/.engram:/opt/data/home/.engram
      - /home/linuxbrew/.linuxbrew/Cellar/engram/1.20.0/bin/engram:/usr/local/bin/engram:ro
      - /home/linuxbrew/.linuxbrew/Cellar/gentle-ai/2.3.0/bin/gentle-ai:/usr/local/bin/gentle-ai:ro
      - ./tools/mcp_tool.py:/opt/hermes/tools/mcp_tool.py:ro
      - /root/golden-game-landing:/opt/repos/golden-game-landing:ro
      - /opt/ai-platform:/opt/repos/ai-platform:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/vault:/opt/vault:ro
      - /root/tools/graphs:/opt/graphs:ro
      - /opt/vps-brain:/opt/vps-brain
    env_file:
      - .env
    restart: unless-stopped
    command: ["gateway", "run"]
    stdin_open: true
    tty: true
